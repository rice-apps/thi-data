services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: thi-rabbitmq
    restart: always
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

  db:
    image: postgres:16
    container_name: thi-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/migrations/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: thi-seaweedfs
    restart: always
    ports:
      - "${STORAGE_S3_PORT:-8333}:8333"
      - "${STORAGE_MASTER_PORT:-9333}:9333"
      - "${STORAGE_FILER_PORT:-8888}:8888"
    command: 'server -s3 -filer -dir /data'
    environment:
      - AWS_ACCESS_KEY_ID=${STORAGE_KEY:-any}
      - AWS_SECRET_ACCESS_KEY=${STORAGE_SECRET:-any}
    volumes:
      - seaweedfs-data:/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: thi-backend
    expose:
      - "${API_PORT:-8000}"
    # Publish API to the host so `make dev` + Next.js on localhost can reach it (proxy in next.config).
    # Override API_PUBLISH_HOST / API_PUBLISH_PORT for bind address and host port.
    ports:
      - "${API_PUBLISH_HOST:-127.0.0.1}:${API_PUBLISH_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./server:/app
    environment:
      - user=${DB_USER:-postgres}
      - password=${DB_PASSWORD:-password}
      - host=db
      - port=5432
      - dbname=${DB_NAME:-postgres}
      - ORIGIN_URL=*
      - broker_url=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - USE_S3=true
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_KEY=${STORAGE_KEY:-any}
      - S3_SECRET=${STORAGE_SECRET:-any}
      - S3_BUCKET=thi-data
    depends_on:
      - rabbitmq
      - db
      - seaweedfs
    command: uvicorn main:app --host 0.0.0.0 --port ${API_PORT:-8000} --reload
  
  celery_worker:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: thi-celery-worker
    volumes:
      - ./server:/app
    environment:
      - user=${DB_USER:-postgres}
      - password=${DB_PASSWORD:-password}
      - host=db
      - port=5432
      - dbname=${DB_NAME:-postgres}
      - ORIGIN_URL=*
      - broker_url=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - USE_S3=true
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_KEY=${STORAGE_KEY:-any}
      - S3_SECRET=${STORAGE_SECRET:-any}
      - S3_BUCKET=thi-data
      - API_SERVER_URL=http://backend:${API_PORT:-8000}
    depends_on:
      - rabbitmq
      - db
      - seaweedfs
      - backend
    command: celery -A celery_task.app worker --loglevel=info

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: thi-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_SUBPATH:-/api}
      - INTERNAL_API_URL=http://backend:${API_PORT:-8000}${API_SUBPATH:-/api}
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: thi-proxy
    restart: always
    ports:
      - "${PUBLIC_PORT:-80}:80"
    environment:
      - API_SUBPATH=${API_SUBPATH:-/api}
      - BACKEND_PORT=${API_PORT:-8000}
    volumes:
      - ./nginx.templates:/etc/nginx/templates:ro
    depends_on:
      - frontend
      - backend

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local
